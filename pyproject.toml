[project]
name = "bizbot"
version = "0.1.0"
description = "Учебный проект в целях осовоения python, разработке ботов, AI интеграций для выхода на фриланс"
readme = "README.md"
authors = [
    { name = "SkaT", email = "161934603+SkaT04@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
bizbot = "bizbot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", ]



